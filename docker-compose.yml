# ============================================================
# Vocero CRM — Ruta B: app + Postgres + Caddy (HTTPS automático)
# Uso:  cp .env.example .env  →  rellenar  →  docker compose up -d --build
# ============================================================
services:
  app:
    # Imagen construida FUERA del VPS (ver Dockerfile multi-stage): evita el
    # pico de memoria de `next build` en producción. Cargar con:
    #   docker save vocero-crm:latest | ssh vocero docker load
    image: vocero-crm:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      # 007 — ruteo por host. Sin estas dos, la app no sabe cuál de los dos
      # dominios es el CRM ni cuál es la web pública, y el canonical del sitio
      # terminaría apuntando al dominio del admin.
      # Obligatorio cuando el dominio del admin NO es un subdominio del público
      # (p. ej. `admin-lamasfood.duckdns.org` vs `lamasfood.duckdns.org`, que son
      # hermanos bajo duckdns.org).
      ADMIN_HOST: ${ADMIN_HOST:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      # 006: Web Push (VAPID) — genera el par con `node scripts/generate-vapid.mjs`.
      # Sin estas claves el push queda deshabilitado en silencio.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      # 008: volumen local de adjuntos — el Dockerfile crea /data/media con el
      # dueño del app, y el volumen nombrado hereda ese dueño al montarse vacío.
      MEDIA_DIR: /data/media
    volumes:
      - vocero_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    # el HEALTHCHECK vive en el Dockerfile (/api/health)

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vocero
    volumes:
      - vocero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocero"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vocero_caddy_data:/data
      - vocero_caddy_config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  vocero_pg:
  vocero_caddy_data:
  vocero_caddy_config:
  vocero_media:
